app:
  mm:
    hours-per-month: 166
    overtime-threshold: 1.0
    top-min-mm: 0.6
  partsr:
    outsourcing-dept-cd: '9000'
  dml-sync:
    cron: ${DML_SYNC_CRON:0 0 3 * * MON}
  gateway:
    enabled: ${GATEWAY_AUTH_ENABLED:true}
    token-header: ${GATEWAY_TOKEN_HEADER:X-Access-Token}
    jwks-url: ${GATEWAY_JWKS_URL:http://172.17.172.125/realms/meritz-internal/protocol/openid-connect/certs}
    issuer: ${GATEWAY_ISSUER:http://172.17.172.125/realms/meritz-internal}
    audience: ${GATEWAY_AUDIENCE:oauth2-proxy}
    allowed-roles: ${GATEWAY_ALLOWED_ROLES:dev-user}   # 우리 서비스 허용 게이트웨이 role — 미확정, 운영팀 확인 필요

spring:
  application:
    name: it-dash
  profiles:
    active: local
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  mvc:
    problemdetails:
      enabled: true   # 표준 예외(필수 파라미터 누락/타입 불일치/404 등)도 RFC7807 ProblemDetail로 응답
  servlet:
    multipart:
      max-file-size: 5MB      # 야근 엑셀 업로드 — 과도한 크기 방지
      max-request-size: 5MB
server:
  address: 0.0.0.0
  port: 8080
  # 게이트웨이(리버스 프록시) 뒤에서 X-Forwarded-Host/Proto/Prefix 존중 —
  # springdoc 서버 URL·리다이렉트가 백엔드 내부 주소가 아닌 외부(게이트웨이) 주소로 생성되게 함(CORS 방지).
  forward-headers-strategy: framework
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:}   # 운영팀 발급 경로명(예: /dml-grant). local은 빈값. 미확정 — 운영팀 확인 필요
datasource:
  app:
    jdbc-url: jdbc:oracle:thin:@localhost:1521/FREEPDB1
    username: appuser
    password: ${APP_DB_PASSWORD:apppw}
    maximum-pool-size: 10
    pool-name: app-pool
  legacy:
    jdbc-url: jdbc:oracle:thin:@localhost:1522/FREEPDB1
    username: legacyuser
    password: ${LEGACY_DB_PASSWORD:legacypw}
    maximum-pool-size: 8
    connection-timeout: 3000
    pool-name: legacy-pool
    read-only: true
    initialization-fail-timeout: -1
    data-source-properties:
      oracle.jdbc.ReadTimeout: 5000
      oracle.net.CONNECT_TIMEOUT: 3000
springdoc:
  swagger-ui:
    path: /swagger-ui
